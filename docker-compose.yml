services:
  moka:
    image: ghcr.io/aka-alvaroso/moka:latest
    restart: unless-stopped
    # SECURITY: bound to loopback only, so the container is reachable solely
    # via a reverse proxy (Caddy/nginx) running on this same host — never
    # directly from the internet on <host-ip>:4003. RENDER_TOKEN does NOT
    # protect the web UI (see .env.example), so this bind is the real
    # boundary. If you genuinely have no reverse proxy and want LAN/internet
    # access straight to the container, change this to "0.0.0.0:${PORT:-4003}:4003"
    # (or just "${PORT:-4003}:4003") — but then put auth/rate-limiting
    # somewhere in front, since RENDER_TOKEN alone won't cover the UI.
    ports:
      - "127.0.0.1:${PORT:-4003}:4003"
    env_file:
      - .env
    # Hard resource ceiling at the container level — tune to your host's specs.
    # These are independent of the MAX_*/FFMPEG_THREADS app-level limits in
    # .env: the container limits protect the host from a runaway process, the
    # app-level ones keep individual renders within that budget.
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
